<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Accident Detection</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0e0e0e;
            color: #ffffff;
            text-align: center;
        }

        header {
            background: #111;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 2px solid #2ecc71;
        }

        .container {
            margin-top: 20px;
        }

        .video-box {
            display: inline-block;
            padding: 10px;
            background: #1a1a1a;
            border: 2px solid #2ecc71;
            border-radius: 8px;
        }

        img {
            width: 720px;
            height: auto;
            border-radius: 4px;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            margin: 0 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease-in-out;
        }

        .start-btn {
            background: #2ecc71;
            color: #000;
        }

        .start-btn:hover {
            background: #27ae60;
        }

        .stop-btn {
            background: #e74c3c;
            color: #fff;
        }

        .stop-btn:hover {
            background: #c0392b;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaaaaa;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #2ecc71;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    🚦 Tunnel CCTV – Live Accident Detection
</header>

<div class="container">

    <div class="video-box">
        <img id="video">
    </div>

    <div class="controls">
        <button class="start-btn" onclick="start()">▶ Start Monitoring</button>
        <button class="stop-btn" onclick="stop()">■ Stop</button>
    </div>

    <div class="status">
        Status: Waiting for camera...
    </div>

    <a href="/">⬅ Back to Dashboard</a>
</div>

<footer>
    AI-based Tunnel Accident Detection System
</footer>

<script>
function start() {
    document.getElementById("video").src = "/video_feed";
}

function stop() {
    document.getElementById("video").src = "";
}
</script>

</body>
</html>
